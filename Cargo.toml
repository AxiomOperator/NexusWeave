[package]
name = "xgraph"
version = "0.1.0"
edition = "2024"
description = "Fast local code graph for AI coding agents: symbols, calls, imports and inheritance across 9 language families, served over MCP"
license = "MIT"
readme = "README.md"
keywords = ["code-intelligence", "mcp", "tree-sitter", "static-analysis", "knowledge-graph"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossbeam-channel = "0.5.17"
ignore = "0.4.33"
libc = "0.2.191"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
tree-sitter = "0.25"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
