name: release

# Push a tag `vX.Y.Z` (matching Cargo.toml's version) to build, checksum and publish binaries.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          # cross-compiled: hosted arm64 Linux runners aren't available to every private repo
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, cross: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Check tag matches Cargo.toml
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$TAG" ] || { echo "tag $TAG != Cargo.toml version v$v"; exit 1; }
      - name: Cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update -q && sudo apt-get install -yq gcc-aarch64-linux-gnu
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir=target/${{ matrix.target }}/release
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            # the viewer embeds the brand fonts: their SIL OFL licenses ship alongside
            7z a "nexusweave-${{ matrix.target }}.zip" "./$dir/nexusweave.exe" README.md ./src/ui/fonts/OFL-*.txt
          else
            cp README.md src/ui/fonts/OFL-*.txt "$dir/"
            (cd "$dir" && tar -czf "$OLDPWD/nexusweave-${{ matrix.target }}.tar.gz" nexusweave README.md OFL-*.txt)
          fi
      - name: Smoke test
        # binaries for another architecture can't run on the build host
        if: ${{ !matrix.cross && matrix.target != 'x86_64-apple-darwin' }}
        shell: bash
        run: target/${{ matrix.target }}/release/nexusweave --version
      - uses: actions/upload-artifact@v4
        with:
          name: nexusweave-${{ matrix.target }}
          path: nexusweave-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum nexusweave-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh dist/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "NexusWeave $TAG" --generate-notes
          fi
