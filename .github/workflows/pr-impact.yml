name: pr-impact

# Builds a change-impact report (changed symbols, callers, routes, tests to run) for a pull request.
# This job runs the PR's code, so it gets a read-only token (fork PRs get one regardless);
# pr-impact-comment.yml posts the uploaded report from a trusted context.
on:
  pull_request:

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Impact report
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p report
          ./target/release/nexusweave init -q
          ./target/release/nexusweave diff-impact --base "origin/$BASE_REF" > report/impact.md
          cat report/impact.md >> "$GITHUB_STEP_SUMMARY"
          echo "$PR_NUMBER" > report/pr-number
      - uses: actions/upload-artifact@v4
        with:
          name: pr-impact
          path: report/
          retention-days: 3
