<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xgraph</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Ccircle cx='10' cy='11' r='3.2' fill='white'/%3E%3Ccircle cx='22' cy='9' r='2.6' fill='white'/%3E%3Ccircle cx='17' cy='22' r='3.6' fill='white'/%3E%3Cpath d='M10 11 22 9M10 11l7 11M22 9l-5 13' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f6f9; --bg2: #eeeef3; --panel: #ffffff; --panel2: #fafafc; --ink: #17171c; --ink2: #3c3c46; --muted: #71717d;
  --line: #e4e4ea; --line2: #d4d4dc; --accent: #5b5bd6; --accent2: #7c7cf0; --accent-soft: #ececfd; --ok: #1f9d6b; --warn: #c27a12; --bad: #d64545;
  --code-bg: #fbfbfd; --hl: #fff3c4; --edge: #b9b9c6; --shadow: 0 1px 2px rgba(20,20,40,.06), 0 4px 16px rgba(20,20,40,.06);
  --shadow-lg: 0 12px 40px rgba(20,20,40,.18);
  --k-fn: #4f6bed; --k-type: #e0663a; --k-iface: #9b5de5; --k-var: #1f9d6b; --k-file: #8b8b98; --k-route: #d6457a; --k-event: #c99a06; --k-other: #6b8e23;
  --t-kw: #8250df; --t-str: #0a7a52; --t-num: #b35900; --t-com: #8b8b98; --t-type: #c4501f; --t-fn: #3557d6;
  --radius: 10px; --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  --bg: #0f0f13; --bg2: #16161c; --panel: #18181f; --panel2: #1d1d25; --ink: #ececf1; --ink2: #c4c4cf; --muted: #8e8e9c;
  --line: #2a2a34; --line2: #363642; --accent: #8b8bff; --accent2: #a5a5ff; --accent-soft: #24244a; --ok: #3ccf91; --warn: #e2a33a; --bad: #f06a6a;
  --code-bg: #14141a; --hl: #4a4020; --edge: #4a4a58; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
  --k-fn: #7d93ff; --k-type: #ff8a5c; --k-iface: #c08bff; --k-var: #4fd39e; --k-file: #9a9aa8; --k-route: #ff6fa3; --k-event: #f0c43a; --k-other: #a3c55c;
  --t-kw: #c49bff; --t-str: #6fd3a5; --t-num: #ffb46b; --t-com: #737382; --t-type: #ff9c70; --t-fn: #8fa8ff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f13; --bg2: #16161c; --panel: #18181f; --panel2: #1d1d25; --ink: #ececf1; --ink2: #c4c4cf; --muted: #8e8e9c;
    --line: #2a2a34; --line2: #363642; --accent: #8b8bff; --accent2: #a5a5ff; --accent-soft: #24244a; --ok: #3ccf91; --warn: #e2a33a; --bad: #f06a6a;
    --code-bg: #14141a; --hl: #4a4020; --edge: #4a4a58; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
    --k-fn: #7d93ff; --k-type: #ff8a5c; --k-iface: #c08bff; --k-var: #4fd39e; --k-file: #9a9aa8; --k-route: #ff6fa3; --k-event: #f0c43a; --k-other: #a3c55c;
    --t-kw: #c49bff; --t-str: #6fd3a5; --t-num: #ffb46b; --t-com: #737382; --t-type: #ff9c70; --t-fn: #8fa8ff;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
::selection { background: var(--accent-soft); }

/* ---------- shell */
.app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }
.rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 14px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #9b5de5); display: grid; place-items: center; box-shadow: 0 2px 8px rgba(91,91,214,.35); flex: none; }
.brand-name { font-weight: 650; font-size: 15px; letter-spacing: -.1px; }
.brand-proj { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
.nav { padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); padding: 14px 10px 6px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink2); font-weight: 500; text-decoration: none; }
.nav a svg { width: 17px; height: 17px; flex: none; opacity: .8; }
.nav a:hover { background: var(--bg2); }
.nav a.on { background: var(--accent-soft); color: var(--accent); }
.nav a.on svg { opacity: 1; }
.nav a .count { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rail-foot { margin-top: auto; padding: 12px 14px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; color: var(--ink2); flex: none; }
.icon-btn:hover { background: var(--bg2); }
.icon-btn svg { width: 16px; height: 16px; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 14px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: relative; z-index: 20; }
.top h1 { font-size: 16px; margin: 0; font-weight: 650; white-space: nowrap; }
.top .sub { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { margin-left: auto; position: relative; width: min(460px, 45vw); }
.search input { width: 100%; padding: 8px 12px 8px 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); outline: none; transition: border-color .15s, box-shadow .15s; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--panel); }
.search > svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
.search kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); }
kbd { font: 11px var(--mono); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); background: var(--panel); }
.sugg { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); max-height: 62vh; overflow: auto; display: none; padding: 4px; }
.sugg .it { padding: 7px 10px; border-radius: 7px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; }
.sugg .it .path { grid-column: 2; }
.sugg .it:hover, .sugg .it.sel { background: var(--bg2); }
.sugg .empty-s { padding: 12px; color: var(--muted); }

.body { flex: 1; display: flex; min-height: 0; position: relative; }
.view { flex: 1; min-width: 0; overflow: auto; position: relative; }
.view.pad { padding: 22px 24px 40px; }
.hidden { display: none !important; }

/* ---------- primitives */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: color-mix(in srgb, var(--c, var(--muted)) 14%, transparent); color: var(--c, var(--muted)); white-space: nowrap; line-height: 18px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); display: inline-block; flex: none; }
.path { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }
.muted { color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--bg2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn.primary:hover { background: var(--accent2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 15px; height: 15px; }
.btn.sm { padding: 4px 9px; font-size: 12.5px; border-radius: 7px; }
.input { padding: 8px 11px; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel); outline: none; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.seg { display: inline-flex; background: var(--bg2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.card-h h3 { margin: 0; font-size: 13.5px; font-weight: 650; }
.card-h .more { margin-left: auto; font-size: 12.5px; }
.card-b { padding: 4px 16px 14px; }
.grid { display: grid; gap: 14px; }
.stat { padding: 14px 16px; }
.stat .v { font-size: 24px; font-weight: 680; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: 12.5px; }
.stat .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
.row-list { list-style: none; margin: 0; padding: 0; }
.row-list li { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 7px; cursor: pointer; min-width: 0; }
.row-list li:hover { background: var(--bg2); }
.row-list .name { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-list .path { margin-left: auto; max-width: 42%; flex: none; }
.bar { height: 6px; border-radius: 3px; background: var(--bg2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 3px; }
table.t { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
table.t th { text-align: left; color: var(--muted); font-weight: 550; font-size: 12px; padding: 9px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
table.t td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr[data-id], table.t tr[data-file] { cursor: pointer; }
table.t tr[data-id]:hover td, table.t tr[data-file]:hover td { background: var(--panel2); }
table.t td.num { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink2); }
.method { font: 600 11px var(--mono); padding: 2px 7px; border-radius: 5px; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
.empty { color: var(--muted); padding: 48px 20px; text-align: center; }
.empty svg { width: 36px; height: 36px; opacity: .5; margin-bottom: 8px; }
.skel { background: linear-gradient(90deg, var(--bg2) 25%, var(--line) 37%, var(--bg2) 63%); background-size: 400% 100%; animation: sk 1.3s ease infinite; border-radius: 6px; }
@keyframes sk { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
.spinner { width: 22px; height: 22px; border: 2.5px solid var(--line2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px); background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 9px; box-shadow: var(--shadow-lg); opacity: 0; transition: .2s; pointer-events: none; z-index: 100; font-weight: 500; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- code */
pre.code { margin: 0; font: 12.5px/1.6 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 9px; padding: 8px 0; overflow: auto; tab-size: 4; }
pre.code .l { display: block; padding-right: 14px; white-space: pre; }
pre.code .l:hover { background: var(--bg2); }
pre.code .l.mark { background: var(--hl); }
pre.code .ln { display: inline-block; width: 4.4em; padding-right: 1.1em; text-align: right; color: var(--muted); opacity: .6; user-select: none; }
.tk-kw { color: var(--t-kw); } .tk-str { color: var(--t-str); } .tk-num { color: var(--t-num); } .tk-com { color: var(--t-com); font-style: italic; }
.tk-ty { color: var(--t-type); } .tk-fn { color: var(--t-fn); }
pre.code a.ref { color: inherit; text-decoration: underline dotted color-mix(in srgb, var(--accent) 60%, transparent); text-underline-offset: 3px; }
pre.code a.ref:hover { background: var(--accent-soft); color: var(--accent); text-decoration: none; border-radius: 3px; }

/* ---------- overview */
.hero { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 18px; }
.hero h2 { margin: 0; font-size: 24px; letter-spacing: -.4px; }
.hero .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
.cards6 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 14px; }
.cols2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); margin-bottom: 14px; }
.langbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 6px 0 12px; background: var(--bg2); }
.langbar i { display: block; height: 100%; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 14px; font-size: 12.5px; }
.legend span { display: flex; align-items: center; gap: 7px; }
.legend b { margin-left: auto; font-weight: 550; color: var(--ink2); font-variant-numeric: tabular-nums; }
.kindrow { display: grid; grid-template-columns: 110px 1fr 54px; align-items: center; gap: 10px; padding: 4px 0; font-size: 12.5px; }
.kindrow .num { text-align: right; color: var(--ink2); font-variant-numeric: tabular-nums; }
.quick { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom: 14px; }
.quick .card { padding: 14px 16px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; transition: border-color .15s, transform .15s; }
.quick .card:hover { border-color: var(--accent); transform: translateY(-1px); }
.quick .ic { width: 34px; height: 34px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.quick .ic svg { width: 18px; height: 18px; }
.quick b { display: block; font-size: 13.5px; }
.quick span { color: var(--muted); font-size: 12.5px; }

/* ---------- graph */
.stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--muted) 22%, transparent) 1px, transparent 0) 0 0 / 22px 22px; }
.stage canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
.stage canvas.dragging { cursor: grabbing; }
.gbar { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; gap: 10px; align-items: center; pointer-events: none; flex-wrap: wrap; }
.gbar > * { pointer-events: auto; }
.chip-root { display: flex; align-items: center; gap: 9px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; box-shadow: var(--shadow); max-width: 46%; min-width: 0; }
.chip-root .name { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; max-width: 260px; }
.chip-root .hint { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
.chip-root .badge, .chip-root svg { flex: none; }
.gctl { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px 5px 12px; box-shadow: var(--shadow); font-size: 12.5px; color: var(--muted); margin-left: auto; }
.gctl label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.gctl select { border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 2px 4px; color: var(--ink); }
.zoom { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.zoom button { border: 0; background: none; width: 34px; height: 32px; cursor: pointer; color: var(--ink2); display: grid; place-items: center; }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom button:hover { background: var(--bg2); }
.zoom svg { width: 16px; height: 16px; }
.glegend { position: absolute; left: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 90px); }
.glegend .lg { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; font-size: 12px; color: var(--ink2); cursor: pointer; user-select: none; box-shadow: var(--shadow); }
.glegend .lg.off { opacity: .4; }
.glegend .lg i { width: 14px; height: 0; border-top: 2px solid var(--c); display: inline-block; }
.glegend .lg i.dash { border-top-style: dashed; } .glegend .lg i.dots { border-top-style: dotted; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow-lg); padding: 8px 11px; font-size: 12.5px; max-width: 360px; z-index: 5; display: none; }
.tip b { display: block; font-size: 13px; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.overlay .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; color: var(--muted); pointer-events: auto; }

/* ---------- drawer */
.drawer { width: 0; flex: none; background: var(--panel); border-left: 1px solid var(--line); overflow: hidden; transition: width .18s ease; position: relative; display: flex; flex-direction: column; }
.drawer.open { width: min(500px, 46vw); }
.dhead { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.dhead .grow { flex: 1; }
.dbody { overflow: auto; padding: 16px 18px 40px; flex: 1; min-width: min(500px, 46vw); }
.dbody h2 { margin: 6px 0 2px; font-size: 18px; letter-spacing: -.2px; word-break: break-word; }
.dbody .qn { color: var(--muted); font: 12px var(--mono); word-break: break-all; }
.dbody .loc { margin: 6px 0 12px; font-size: 12.5px; }
.dbody .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.sec { margin-top: 16px; }
.sec > .sh { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; cursor: pointer; user-select: none; }
.sec > .sh h4 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); font-weight: 650; }
.sec > .sh .n { font-size: 11px; color: var(--muted); background: var(--bg2); border-radius: 99px; padding: 0 7px; }
.sec > .sh svg { width: 13px; height: 13px; color: var(--muted); margin-left: auto; transition: transform .15s; }
.sec.closed > .sh svg { transform: rotate(-90deg); }
.sec.closed > .sb { display: none; }
.sig { font: 12.5px/1.55 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.doc { color: var(--ink2); margin: 10px 0 0; white-space: pre-wrap; font-size: 13px; }
.rel li { padding: 5px 7px; }
.rel .ek { font-size: 10.5px; color: var(--muted); font-family: var(--mono); flex: none; }

/* ---------- tools */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .input { flex: 1; min-width: 200px; }
.flow-steps { list-style: none; margin: 0; padding: 0; position: relative; }
.flow-steps li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; }
.flow-steps .num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 650; font-size: 12.5px; position: relative; z-index: 1; }
.flow-steps li:not(:last-child) .num::after { content: ""; position: absolute; top: 30px; left: 13px; width: 2px; height: 40px; background: var(--line2); }
.flow-steps .step { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; margin-bottom: 14px; cursor: pointer; box-shadow: var(--shadow); min-width: 0; }
.flow-steps .step:hover { border-color: var(--accent); }
.flow-steps .step b { font-size: 13.5px; }

    body.innerHTML = `
      <div>${kindBadge("file")}</div>

      ${f.dependencies.length ? sec("Depends on", f.dependencies.length, plist(f.dependencies), f.dependencies.length > 25) : ""}
      ${sec("Code", null, `<p class="muted" style="margin:0 0 8px;font-size:12.5px">Underlined names link to their definitions.</p>` + codeBlock(fc.lines || [], 1, f.path, {render, mark: line ? [line, line] : []}))}`;
    if (line) body.querySelector("pre.code .l.mark")?.scrollIntoView({block: "center"});
  }
  async function renderDir(dir, _line, live) {
    const d = await api("/api/dir", {path: dir});
    if (!live()) return;
    const max = Math.max(1, ...d.files.map(x => x.symbols));
    body.innerHTML = `<div><span class="badge" style="--c:var(--accent)">directory</span></div><h2 class="mono" style="font-size:15px">${esc(dir)}/</h2>
      <div class="loc muted">${fmt(d.files.length)}${d.files.length >= 400 ? "+" : ""} files, largest first</div>
      <table class="t"><tr><th>file</th><th style="width:30%">symbols</th></tr>${d.files.map(x => `<tr data-file="${esc(x.path)}"><td><span class="path" style="color:var(--ink2)">${esc(x.path.slice(dir.length + 1) || x.path)}</span></td>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:${100 * x.symbols / max}%;--c:${LANG_COLORS[x.lang] || "var(--accent)"}"></i></div><span class="muted" style="font-size:12px;min-width:30px;text-align:right">${fmt(x.symbols)}</span></div></td></tr>`).join("")}</table>`;
  }
  return { open, close, isOpen };
})();

// ---------- graph
let graphRoot = null, graphSeq = 0;
graph.onClick.node = n => { if (graph.mode === "modules") drawer.open({type: "dir", key: n.id}); else drawer.open({type: "sym", key: n.id}); };
graph.onClick.dbl = n => { if (graph.mode !== "modules") location.hash = "#/graph/" + n.id; };
async function defaultRoot() {
  const st = await api("/api/start").catch(() => ({}));
  if (st.id != null) return st.id;
  const hot = await api("/api/analyze", {what: "hotspots", limit: 1}).catch(() => []);
  if (hot[0]) return hot[0].sym.id;
  const s = await statsReady.catch(() => null);
  const any = await api("/api/search", {q: (s && Object.keys(s.kinds || {}).includes("function")) ? "main" : "a", limit: 1}).catch(() => []);
  return any[0]?.id ?? null;
}
async function viewGraph(id) {
  showView("graph");
  $("#gctl").classList.remove("hidden"); $$("#gctl > label").forEach(l => l.classList.toggle("hidden", l.id === "mdepth-l"));
  const seq = ++graphSeq;
  let auto = false;
  if (id == null) { id = graphRoot ?? await defaultRoot(); auto = graphRoot == null; }
  if (seq !== graphSeq) return;
  if (id == null) { $("#groot").innerHTML = `<span class="hint">This index has no symbols yet.</span>`; graph.set([], []); return; }
  graphRoot = id;
  $("#gload").classList.remove("hidden"); $("#gload-t").textContent = "Loading graph…";
  try {
    const g = await api("/api/graph", {id, depth: $("#depth").value, limit: 90, tests: $("#tests").checked ? 1 : 0});
    if (seq !== graphSeq) return;
    const root = g.nodes.find(n => n.id === id);
    if (!root) {
      // ids change when the project is re-indexed, so old links can point nowhere
      $("#groot").innerHTML = `<span class="hint">That symbol isn't in the index any more (it was re-indexed or removed). Search to pick another.</span>`;
      graphRoot = null; graph.set([], []); drawer.close(); return;
    }
    $("#groot").innerHTML = root ? `${kindBadge(root.kind)}<span class="name" title="${esc(root.qname)}">${esc(label(root))}</span><span class="hint">${fmt(g.nodes.length - 1)} neighbors${auto ? " · a central function — search or double-click a node to move" : " · double-click a node to re-center"}</span>` : "";
    $("#subtitle").textContent = root ? `${root.path}:${root.line}` : "";
    graph.set(g.nodes, g.edges, {mode: "calls", root: id});
    if (g.nodes.length <= 1) $("#groot").innerHTML += `<span class="hint">· no resolved callers or callees</span>`;
  } catch (e) { $("#groot").innerHTML = `<span class="hint" style="color:var(--bad)">${esc(e.message)}</span>`; }
  finally { if (seq === graphSeq) $("#gload").classList.add("hidden"); }
}
async function viewModules() {
  showView("modules");
  $$("#gctl > label").forEach(l => l.classList.toggle("hidden", l.id !== "mdepth-l"));
  const seq = ++graphSeq;
  $("#gload").classList.remove("hidden"); $("#gload-t").textContent = "Aggregating directories…";
  try {
    const m = await api("/api/modules", {depth: $("#mdepth").value});
    if (seq !== graphSeq) return;
    const top = m.modules.sort((a, b) => b.symbols - a.symbols).slice(0, 90);
    const keep = new Set(top.map(x => x.id));
    const links = m.links.filter(l => keep.has(l.source) && keep.has(l.target));
    $("#groot").innerHTML = `${ICON.dir.replace("<svg", '<svg style="width:16px;height:16px;color:var(--accent)"')}<span class="name">${fmt(top.length)} directories</span><span class="hint">${m.modules.length > top.length ? `largest ${top.length} of ${fmt(m.modules.length)} · ` : ""}click one to list its files</span>`;
    $("#subtitle").textContent = "";
    graph.set(top, links, {mode: "modules"});
  } catch (e) { $("#groot").innerHTML = `<span class="hint" style="color:var(--bad)">${esc(e.message)}</span>`; }
  finally { if (seq === graphSeq) $("#gload").classList.add("hidden"); }
}
$("#depth").onchange = $("#tests").onchange = () => graphRoot != null && viewGraph(graphRoot);
$("#mdepth").onchange = () => viewModules();

    const md = p.map((s, i) => `${i + 1}. \`${label(s)}\` (${s.path}:${s.line})`).join("\n");
    const mm = "flowchart TD\n" + p.map((s, i) => `  n${i}["${label(s).replace(/"/g, "'")}"]`).join("\n") + "\n" + p.slice(1).map((_, i) => `  n${i} --> n${i + 1}`).join("\n");

      <ol class="flow-steps">${p.map((s, i) => `<li><span class="num">${i + 1}</span><div class="step" data-id="${s.id}"><div style="display:flex;gap:8px;align-items:center">${kindBadge(s.kind)}<b>${esc(label(s))}</b></div><div class="path">${esc(s.path)}:${s.line}</div></div></li>`).join("")}</ol>`;
    $("#fmd").onclick = () => copy(md, "Copied as Markdown"); $("#fmm").onclick = () => copy(mm, "Copied as Mermaid");
    $("#fsave").onclick = () => { trails.set([{from: f, to: t, at: Date.now()}, ...trails.get().filter(x => !(x.from === f && x.to === t))]); renderTrails(); toast("Saved"); };
  };

  el.querySelector(".seg").onclick = e => { const b = e.target.closest("[data-k]"); if (b) location.hash = "#/insights/" + b.dataset.k; };
  let d;
  try { d = await api("/api/analyze", {what, limit: 300}); } catch (e) { $("#iout").innerHTML = errBox(e); return; }
  const row = (s, cells) => `<tr data-id="${s.id}">${cells.map(c => `<td>${c}</td>`).join("")}</tr>`;
  const nm = s => `<span style="display:flex;align-items:center;gap:8px">${kindDot(s.kind)}<b>${esc(label(s))}</b></span>`;
  let html;
  if (!d.length) html = `<div class="empty">${{hotspots: "No hot spots.", entry: "No entry points detected.", dead: "Nothing unreferenced — every symbol is used somewhere.", cycles: "No import cycles. 🎉"}[what]}</div>`;
  else if (what === "hotspots") {
    const m = Math.max(...d.map(h => h.fan_in));
    html = `<table class="t"><tr><th>symbol</th><th style="width:22%">fan-in</th><th class="num">lines</th><th class="num">commits (90d)</th><th>location</th></tr>${d.map(h => row(h.sym, [nm(h.sym),
      `<div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:${100 * h.fan_in / m}%"></i></div><span class="muted" style="font-size:12px;min-width:34px;text-align:right">${fmt(h.fan_in)}</span></div>`,
      `<span class="muted">${fmt(h.lines)}</span>`, `<span class="muted">${fmt(h.churn)}</span>`, `<span class="path">${esc(h.sym.path)}:${h.sym.line}</span>`])).join("")}</table>`;
  } else if (what === "dead") html = `<div class="card-h"><span class="muted" style="font-size:12.5px">Not referenced anywhere in the index, by resolved or unresolved references. Reflection, string dispatch and callers outside the project are invisible to the graph — verify before deleting.</span></div>
      <table class="t"><tr><th>symbol</th><th>kind</th><th>location</th></tr>${d.map(s => row(s, [nm(s), kindBadge(s.kind), `<span class="path">${esc(s.path)}:${s.start_line}</span>`])).join("")}</table>`;
  else if (what === "cycles") html = `<div class="card-b">${d.map(c => `<div class="cyc"><span class="badge" style="--c:var(--warn)">${c.files.length} files</span>${c.path.map((p, i) => `${i ? '<span class="ar">→</span>' : ""}<span class="f" data-file="${esc(p)}">${esc(p)}</span>`).join("")}</div>`).join("")}</div>`;
  else html = `<table class="t"><tr><th>entry point</th><th>why</th><th>location</th></tr>${d.map(e => row(e.sym, [nm(e.sym), `<span class="badge">${esc(e.why)}</span>`, `<span class="path">${esc(e.sym.path)}:${e.sym.line}</span>`])).join("")}</table>`;
  $("#iout").innerHTML = html;
  $("#iout").onclick = e => {
    const f = e.target.closest("[data-file]"); if (f) { drawer.open({type: "file", key: f.dataset.file}); return; }
    const tr = e.target.closest("[data-id]"); if (tr) drawer.open({type: "sym", key: +tr.dataset.id});
  };
}

// ---------- explore
function renderMarkdown(md) {
  const lines = md.split("\n"); let out = "", i = 0, list = null;
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/([\w.\/-]+\.[A-Za-z]{1,6}):(\d+)/g, (m, p, l) => `<a data-file="${p}" data-line="${l}">${m}</a>`);
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith("```")) {
      closeList(); const lang = l.slice(3).trim(); const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++;
      // explore prints "  12\tcode": keep its line numbers
      const numbered = buf.length && buf.every(x => /^\s*\d+\t/.test(x) || /^\s*⋮/.test(x) || x === "");
      out += `<pre class="code">${buf.map(x => {
        const m = numbered && x.match(/^\s*(\d+)\t(.*)$/);
        if (m) return `<span class="l"><span class="ln">${m[1]}</span>${highlight(m[2], "." + lang)}</span>`;
        if (numbered && /^\s*⋮/.test(x)) return `<span class="l"><span class="ln">⋮</span></span>`;
        return `<span class="l">${highlight(x, "." + lang)}</span>`;
      }).join("")}</pre>`;
      continue;
    }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { closeList(); out += `<h${Math.min(4, m[1].length + 1)}>${inline(m[2])}</h${Math.min(4, m[1].length + 1)}>`; }
    else if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { closeList(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*(\d+)\.\s+(.*)/))) { if (list !== "ol") { closeList(); out += "<ol>"; list = "ol"; } out += `<li value="${m[1]}">${inline(m[2])}</li>`; }
    else if (list === "ol" && (m = l.match(/^\s*↓\s*(.*)/))) out += `<li class="hop">↓ ${esc(m[1])}</li>`;
    else if (l.trim() === "") closeList();
    else { closeList(); out += `<p>${inline(l)}</p>`; }
    i++;
  }
  closeList();
  return out;
}
function viewExplore(params) {
  showView("explore");
  const q0 = params.get("q") || store.get("lastAsk", "");
  const el = $("#v-explore");
  el.innerHTML = `
    <div class="card" style="padding:16px;margin-bottom:16px">
      <textarea class="input" id="eq" rows="3" style="width:100%;resize:vertical" placeholder="Ask like your agent would: how does UserService.login validate the token?">${esc(q0)}</textarea>
      <div style="display:flex;gap:10px;align-items:center;margin-top:10px">
        <button class="btn primary" id="ego">${ICON.spark}Ask</button>
        <div class="seg" id="ebud"><button data-b="1500">Brief</button><button data-b="" class="on">Standard</button><button data-b="8000">Thorough</button></div>
        <span class="muted" style="font-size:12.5px;margin-left:auto">Same output as the <code>xgraph_explore</code> MCP tool · <kbd>Ctrl</kbd>+<kbd>Enter</kbd></span>
      </div>
    </div>
    <div id="eout" class="md"></div>`;
  let budget = "";
  $("#ebud").onclick = e => { const b = e.target.closest("[data-b]"); if (!b) return; budget = b.dataset.b; $$("#ebud button").forEach(x => x.classList.toggle("on", x === b)); };
  const run = async () => {
    const q = $("#eq").value.trim(); if (!q) return;
    store.set("lastAsk", q);
    $("#eout").innerHTML = `<div class="card" style="padding:30px;display:grid;place-items:center"><div class="spinner"></div></div>`;
    try {
      const r = await api("/api/explore", budget ? {q, budget} : {q});
      $("#eout").innerHTML = `<div class="card" style="padding:6px 20px 16px">${renderMarkdown(r.text || "")}</div>`;
      $("#eout").onclick = e => { const a = e.target.closest("[data-file]"); if (a) drawer.open({type: "file", key: a.dataset.file, line: +a.dataset.line || 0}); };
    } catch (e) { $("#eout").innerHTML = errBox(e); }
  };
  $("#ego").onclick = run;
  $("#eq").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); } });
  $("#eq").focus();
}

// ======================================================================= router
function route() {
  const h = location.hash.replace(/^#\/?/, "");
  const [pathPart, query = ""] = h.split("?");
  const [v, arg] = pathPart.split("/");
  const params = new URLSearchParams(query);
  hideSugg();
  switch (v) {
    case "sym": location.replace("#/graph/" + arg); return;          // links from older versions
    case "graph": { const id = arg ? +arg : null; viewGraph(id); if (id != null) drawer.open({type: "sym", key: id}); return; }
    case "modules": viewModules(); return;
    case "routes": viewRoutes(); return;
    case "flow": viewFlow(params); return;
    case "insights": viewInsights(arg || "hotspots"); return;
    case "explore": viewExplore(params); return;
    default: viewOverview();
  }
}
addEventListener("hashchange", route);
route();
